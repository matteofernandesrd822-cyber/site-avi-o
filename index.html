<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scroll Animation</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #000;
    overscroll-behavior: none;
  }

  .scroll-space {
    width: 100%;
    /* 20px of scroll per frame gives smooth, controllable scrubbing */
    height: calc(var(--frame-count) * 20px + 100vh);
  }

  .stage {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
</style>
</head>
<body>
<div class="scroll-space" id="scrollSpace"></div>
<div class="stage">
  <canvas id="canvas"></canvas>
</div>

<script>
(function () {
  const FRAME_COUNT = 342;
  const FRAME_PATH = i => `./frames/frame_${String(i).padStart(4, '0')}.webp`;
  const NATIVE_W = 1920;
  const NATIVE_H = 1080;

  document.documentElement.style.setProperty('--frame-count', FRAME_COUNT);

  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  const images = new Array(FRAME_COUNT);
  let lastDrawnIndex = -1;

  function nearestLoaded(index) {
    for (let d = 0; d < FRAME_COUNT; d++) {
      const lo = index - d;
      const hi = index + d;
      if (lo >= 0 && images[lo]) return lo;
      if (hi < FRAME_COUNT && images[hi]) return hi;
    }
    return -1;
  }

  function resizeCanvas() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(window.innerWidth * dpr);
    canvas.height = Math.round(window.innerHeight * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw(lastDrawnIndex === -1 ? 0 : lastDrawnIndex, true);
  }

  function draw(index, force) {
    let img = images[index];
    let useIndex = index;

    // Fallback to the nearest already-loaded frame to avoid blank/stutter
    if (!img) {
      const nearest = nearestLoaded(index);
      if (nearest === -1) return;
      useIndex = nearest;
      img = images[useIndex];
    }

    if (!force && useIndex === lastDrawnIndex) return;
    lastDrawnIndex = useIndex;

    const cw = window.innerWidth;
    const ch = window.innerHeight;
    const scale = Math.max(cw / NATIVE_W, ch / NATIVE_H);
    const dw = NATIVE_W * scale;
    const dh = NATIVE_H * scale;
    const dx = (cw - dw) / 2;
    const dy = (ch - dh) / 2;

    ctx.clearRect(0, 0, cw, ch);
    ctx.drawImage(img, dx, dy, dw, dh);
  }

  function currentTargetFrame() {
    const scrollSpace = document.getElementById('scrollSpace');
    const maxScroll = scrollSpace.offsetHeight - window.innerHeight;
    const progress = maxScroll > 0 ? Math.min(Math.max(window.scrollY / maxScroll, 0), 1) : 0;
    return Math.round(progress * (FRAME_COUNT - 1));
  }

  let ticking = false;
  function onScroll() {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(function () {
      draw(currentTargetFrame(), false);
      ticking = false;
    });
  }

  function preload() {
    for (let i = 0; i < FRAME_COUNT; i++) {
      const img = new Image();
      img.decoding = 'async';
      img.src = FRAME_PATH(i + 1);
      img.onload = function () {
        images[i] = img;
        if (i === 0) draw(0, true);
        if (i === currentTargetFrame()) draw(i, true);
      };
    }
  }

  window.addEventListener('resize', resizeCanvas);
  window.addEventListener('scroll', onScroll, { passive: true });

  resizeCanvas();
  preload();
})();
</script>
</body>
</html>
